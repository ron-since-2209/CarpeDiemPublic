<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarpeDiem UI</title>

  <!-- 検索エンジンから完全に除外 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

  <!-- UI 用 CSS -->
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>

  <header>
    <h1>CarpeDiem UI</h1>
    <p>データ読み込み用UI (要認証)</p>
  </header>

  <main>
    <section id="auth-section">
      <h2>GitHub OAuth 認証</h2>
      <button id="login-btn">GitHub でログイン</button>
      <p id="auth-status"></p>
    </section>

    <section id="data-section" style="display:none;">
      <h2>データ読み込み</h2>
      <button id="load-data-btn">PrivateRepo の JSON を読み込む</button>
      <pre id="result"></pre>
    </section>
  </main>

  <!-- OAuth 認証ロジック -->
  <script src="./js/auth.js"></script>

  <!-- PrivateRepo の JSON を取得するロジック -->
  <script src="./js/app.js"></script>

</body>
</html>
